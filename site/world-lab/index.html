<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050914" />
  <title>HIGHFLY — ClaudeCraft World Preview</title>
  <style>
    :root{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #hud{position:fixed;inset:0;pointer-events:none}
    .panel{pointer-events:auto;position:absolute;left:14px;top:14px;max-width:min(520px,calc(100vw - 28px));padding:12px 14px;border:1px solid rgba(81,185,255,.42);border-radius:14px;background:rgba(4,9,22,.84);backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .tag{font-size:11px;font-weight:800;letter-spacing:.09em;color:#8cecff}
    h1{margin:5px 0 4px;font-size:18px}
    #status{font-size:12px;color:#b9c9df;line-height:1.45}
    .buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
    button{appearance:none;border:1px solid #315988;border-radius:10px;background:#0a1730;color:#eaf7ff;padding:8px 10px;font-weight:700;font-size:12px;cursor:pointer}
    button.on{border-color:#65d9ff;background:#11314d;color:#9beeff}
    #legend{position:absolute;right:14px;bottom:14px;padding:10px 12px;border-radius:12px;background:rgba(4,9,22,.82);font-size:11px;color:#c9d7e9;line-height:1.6}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
    .camp{background:#ff5a4e}.gather{background:#61db78}.portal{background:#a970ff}
    #error{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:30px;background:#050914;color:#fff}
    @media (max-width:700px){.panel{padding:9px 10px}.buttons{gap:5px}button{padding:7px 8px}#legend{font-size:10px}}
  </style>
</head>
<body>
  <div id="error"></div>
  <div id="hud">
    <div class="panel">
      <div class="tag">HIGHFLY · CLAUDECRAFT WORLD DATA</div>
      <h1>World Preview v0.1</h1>
      <div id="status">Cargando export…</div>
      <div class="buttons">
        <button id="roads" class="on">CAMINOS</button>
        <button id="camps" class="on">CAMPAMENTOS</button>
        <button id="gather" class="on">RECURSOS</button>
        <button id="portals" class="on">PORTALES</button>
        <button id="reset">RESET CÁMARA</button>
      </div>
    </div>
    <div id="legend">
      <div><span class="dot camp"></span>camp / mobs</div>
      <div><span class="dot gather"></span>gathering</div>
      <div><span class="dot portal"></span>portales</div>
      <div>Arrastrá para rotar · pellizcá/rueda para zoom</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const errorEl=document.getElementById('error');
    const statusEl=document.getElementById('status');

    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x07101f);
    scene.fog=new THREE.FogExp2(0x07101f,0.00135);

    const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,0.1,5000);
    camera.position.set(220,210,-240);

    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
    renderer.setSize(innerWidth,innerHeight);
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.dampingFactor=.07;
    controls.maxDistance=1800;
    controls.minDistance=15;
    controls.target.set(0,0,450);

    scene.add(new THREE.HemisphereLight(0xb7d9ff,0x213219,1.5));
    const sun=new THREE.DirectionalLight(0xffffff,1.25);
    sun.position.set(-180,340,-120);
    scene.add(sun);

    const groups={
      terrain:new THREE.Group(),
      water:new THREE.Group(),
      roads:new THREE.Group(),
      camps:new THREE.Group(),
      gather:new THREE.Group(),
      portals:new THREE.Group()
    };
    Object.values(groups).forEach(g=>scene.add(g));

    const ux=x=>-x;

    function zoneColor(id=''){
      const v=id.toLowerCase();
      if(v.includes('frost')) return 0x8da6ad;
      if(v.includes('marsh')||v.includes('willow')) return 0x345c3f;
      if(v.includes('drake')) return 0x65483a;
      if(v.includes('night')||v.includes('wraith')) return 0x343c50;
      if(v.includes('palm')||v.includes('farshore')) return 0x4d7b48;
      if(v.includes('amber')) return 0x806238;
      return 0x477b49;
    }

    let data=null;
    function sampleHeight(x,z){
      if(!data?.terrain) return 0;
      for(const t of data.terrain){
        if(x<t.minX||x>t.maxX||z<t.minZ||z>t.maxZ) continue;
        const fx=Math.max(0,Math.min(t.width-1,(x-t.minX)/t.step));
        const fz=Math.max(0,Math.min(t.depth-1,(z-t.minZ)/t.step));
        const x0=Math.floor(fx),z0=Math.floor(fz);
        const x1=Math.min(x0+1,t.width-1),z1=Math.min(z0+1,t.depth-1);
        const tx=fx-x0,tz=fz-z0;
        const h=(xx,zz)=>t.heights[zz*t.width+xx]??0;
        const a=THREE.MathUtils.lerp(h(x0,z0),h(x1,z0),tx);
        const b=THREE.MathUtils.lerp(h(x0,z1),h(x1,z1),tx);
        return THREE.MathUtils.lerp(a,b,tz);
      }
      return 0;
    }

    function buildTerrain(){
      for(const t of data.terrain){
        const stride=(t.width*t.depth>18000)?2:1;
        const xs=Math.floor((t.width-1)/stride)+1;
        const zs=Math.floor((t.depth-1)/stride)+1;
        const pos=new Float32Array(xs*zs*3);
        let p=0;
        for(let iz=0;iz<zs;iz++){
          const sz=Math.min(t.depth-1,iz*stride);
          const z=Math.min(t.maxZ,t.minZ+sz*t.step);
          for(let ix=0;ix<xs;ix++){
            const sx=Math.min(t.width-1,ix*stride);
            const x=Math.min(t.maxX,t.minX+sx*t.step);
            const h=t.heights[sz*t.width+sx]??0;
            pos[p++]=ux(x);pos[p++]=h;pos[p++]=z;
          }
        }
        const idx=[];
        for(let z=0;z<zs-1;z++)for(let x=0;x<xs-1;x++){
          const a=z*xs+x,b=a+1,c=a+xs,d=c+1;
          idx.push(a,c,b,b,c,d);
        }
        const geo=new THREE.BufferGeometry();
        geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        const mat=new THREE.MeshStandardMaterial({color:zoneColor(t.zoneId),roughness:.95,metalness:0});
        const mesh=new THREE.Mesh(geo,mat);
        mesh.name=t.zoneId;
        groups.terrain.add(mesh);
      }
    }

    function buildWater(){
      const mat=new THREE.MeshStandardMaterial({color:0x1766a0,transparent:true,opacity:.62,roughness:.25,metalness:.05,side:THREE.DoubleSide});
      for(const z of data.zones||[]){
        for(const l of z.lakes||[]){
          const r=Math.max(.5,l.radius*1.6);
          const g=new THREE.CircleGeometry(r,48);
          const m=new THREE.Mesh(g,mat);
          m.rotation.x=-Math.PI/2;
          m.position.set(ux(l.x),data.waterLevel+.06,l.z);
          groups.water.add(m);
        }
      }
    }

    function buildRoads(){
      const mat=new THREE.LineBasicMaterial({color:0xc2a46e,transparent:true,opacity:.92});
      for(const r of data.roads||[]){
        if(!r.points||r.points.length<2)continue;
        const pts=r.points.map(p=>new THREE.Vector3(ux(p.x),sampleHeight(p.x,p.z)+.22,p.z));
        groups.roads.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
      }
    }

    function pointCloud(rows,color,size){
      if(!rows?.length)return new THREE.Points();
      const pos=new Float32Array(rows.length*3);
      rows.forEach((r,i)=>{pos[i*3]=ux(r.x);pos[i*3+1]=sampleHeight(r.x,r.z)+1.3;pos[i*3+2]=r.z});
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      return new THREE.Points(g,new THREE.PointsMaterial({color,size,sizeAttenuation:true}));
    }

    function buildMarkers(){
      groups.camps.add(pointCloud(data.camps,0xff5a4e,2.8));
      groups.gather.add(pointCloud(data.gatherNodes,0x61db78,2.2));
      groups.portals.add(pointCloud(data.portals,0xa970ff,4.0));
    }

    function resetCamera(){
      const p=data?.playerStart||{x:0,z:0};
      const y=sampleHeight(p.x,p.z);
      controls.target.set(ux(p.x),y,p.z);
      camera.position.set(ux(p.x)+155,y+135,p.z-185);
      controls.update();
    }

    async function main(){
      try{
        const res=await fetch('../data/world.json',{cache:'no-store'});
        if(!res.ok)throw new Error('HTTP '+res.status);
        data=await res.json();
        buildTerrain();buildWater();buildRoads();buildMarkers();resetCamera();
        statusEl.textContent=`${data.zones?.length||0} zonas · ${data.roads?.length||0} caminos · ${data.camps?.length||0} camps · ${data.gatherNodes?.length||0} nodos · seed ${data.worldSeed}`;
      }catch(err){
        errorEl.style.display='grid';
        errorEl.innerHTML='<div><h2>No pude cargar el export</h2><p>'+String(err)+'</p></div>';
        throw err;
      }
    }

    const toggles=[['roads','roads'],['camps','camps'],['gather','gather'],['portals','portals']];
    for(const [id,key] of toggles){
      document.getElementById(id).onclick=e=>{
        groups[key].visible=!groups[key].visible;
        e.currentTarget.classList.toggle('on',groups[key].visible);
      };
    }
    document.getElementById('reset').onclick=resetCamera;

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    function frame(){
      requestAnimationFrame(frame);
      controls.update();
      renderer.render(scene,camera);
    }

    await main();
    frame();
  </script>
</body>
</html>
