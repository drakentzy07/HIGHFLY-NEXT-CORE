name: HIGHFLY Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sync ClaudeCraft world data
        run: |
          mkdir -p site/data
          curl -L --fail --retry 5 \
            https://raw.githubusercontent.com/drakentzy07/HIGHFLY-NEXT-CORE/world-data-v0433/unity-world-v01.json \
            -o site/data/world.json
          test -s site/data/world.json

      - name: Stage ClaudeCraft Unity WebGL
        env:
          WEBGL_ZIP_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1950-820e-ace3-8b4b33a98b53/raw?se=2026-09-23T20%3A22%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=37644d07-7ad6-5d1b-8827-56b3c5976c07&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T15%3A37%3A03Z&ske=2026-09-24T15%3A37%3A03Z&sks=b&skv=2026-02-06&sig=UQqDoX5t9aX12HOTVFnYQPiD4uEhSiySNeEzk0eP8UQ%3D"
        run: |
          rm -rf site/claudecraft-unity
          mkdir -p site/claudecraft-unity
          curl -L --fail --retry 5 --retry-delay 2 "$WEBGL_ZIP_URL" -o /tmp/highfly-webgl.zip
          unzip -q /tmp/highfly-webgl.zip -d site/claudecraft-unity
          test -s site/claudecraft-unity/index.html
          test -s site/claudecraft-unity/Build/HIGHFLY-WORLD-LAB.loader.js
          test -s site/claudecraft-unity/Build/HIGHFLY-WORLD-LAB.framework.js
          test -s site/claudecraft-unity/Build/HIGHFLY-WORLD-LAB.wasm
          test -s site/claudecraft-unity/Build/HIGHFLY-WORLD-LAB.data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
