name: HIGHFLY Storage Cleanup

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  workflow_run:
    workflows: [ "Build HIGHFLY APK" ]
    types: [ completed ]

permissions:
  actions: write
  contents: read

concurrency:
  group: highfly-storage-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reclaim HIGHFLY Actions storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "== Actions artifacts before cleanup =="
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes, .expired] | @tsv' || true

          deleted_artifacts=0
          while IFS=$'\t' read -r artifact_id artifact_name; do
            [ -z "${artifact_id:-}" ] && continue
            case "$artifact_name" in
              HIGHFLY-APK-*|HIGHFLY-NEXT-CORE-*|github-pages)
                echo "Deleting disposable artifact: $artifact_name ($artifact_id)"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
                deleted_artifacts=$((deleted_artifacts + 1))
                ;;
            esac
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .name] | @tsv'
          )

          echo "== Actions caches before cleanup =="
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .key, .size_in_bytes] | @tsv' || true

          deleted_caches=0
          while read -r cache_id; do
            [ -z "${cache_id:-}" ] && continue
            echo "Deleting rebuildable Actions cache: $cache_id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
            deleted_caches=$((deleted_caches + 1))
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
              --jq '.actions_caches[].id' || true
          )

          echo "Deleted artifacts: ${deleted_artifacts}"
          echo "Deleted caches: ${deleted_caches}"
          echo "The rolling GitHub Release is not touched by this cleanup."

          echo "== Remaining Actions artifacts =="
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .size_in_bytes] | @tsv' || true
