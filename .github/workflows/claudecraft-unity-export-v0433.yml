name: ClaudeCraft Unity Export v0.43.3

on:
  workflow_dispatch:
  push:
    branches:
      - highfly/claudecraft-donor-v0433
    paths:
      - ".github/workflows/claudecraft-unity-export-v0433.yml"
      - "scripts/export-claudecraft-unity.ts"

permissions:
  contents: read
  actions: read

jobs:
  unity-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout HIGHFLY overlay
        uses: actions/checkout@v4

      - name: Reuse successful ClaudeCraft donor core
        uses: actions/download-artifact@v4
        with:
          name: HIGHFLY-CLAUDECRAFT-DONOR-CORE-v0.43.3
          path: donor-core
          repository: drakentzy07/HIGHFLY-NEXT-CORE
          run-id: 35898841725
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore donor checkout layout
        run: |
          rm -rf game
          if [ -d donor-core/game ]; then
            mv donor-core/game game
          else
            mkdir -p game
            cp -a donor-core/. game/
          fi
          test -s game/src/sim/data.ts
          test -s game/src/sim/world.ts
          test -s game/package.json
          du -sh game
          find game -maxdepth 2 -type d | sort | head -80

      - name: Copy HIGHFLY exporter into donor core
        run: cp scripts/export-claudecraft-unity.ts game/highfly_export_unity.ts

      - name: Export resolved world data
        working-directory: game
        run: |
          npx --yes tsx@4.22.4 highfly_export_unity.ts ../highfly-unity-export
          du -sh ../highfly-unity-export
          find ../highfly-unity-export -maxdepth 2 -type f -printf "%p %k KB\n" | sort

      - name: Validate required outputs
        run: |
          test -s highfly-unity-export/meta.json
          test -s highfly-unity-export/world-core.json
          test -s highfly-unity-export/entities.json
          test -s highfly-unity-export/gameplay.json
          test -s highfly-unity-export/decorations.json
          test -s highfly-unity-export/terrain/index.json
          node -e "const m=require('./highfly-unity-export/meta.json'); if(!m.counts?.zones || !m.counts?.dungeons) process.exit(1); console.log(m)"

      - name: Upload Unity-ready world data
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-CLAUDECRAFT-UNITY-DATA-v0.43.3
          compression-level: 6
          path: highfly-unity-export/**
          if-no-files-found: error
          retention-days: 30

      - name: Final disk report
        if: always()
        run: df -h
