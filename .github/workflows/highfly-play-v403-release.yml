          import urllib.request,time,json
          base='https://drakentzy07.github.io/HIGHFLY-NEXT-CORE/'
          out={}
          for path in ['play-v403/','world-lab/','claudecraft-unity/','']:
            for attempt in range(20):
              try:
                req=urllib.request.Request(base+path,headers={'User-Agent':'HIGHFLY-PLAY-VERIFY','Cache-Control':'no-cache'})
