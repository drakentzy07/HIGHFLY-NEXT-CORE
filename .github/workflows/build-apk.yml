name: Build HIGHFLY Foundation APK

on:
  workflow_dispatch:
  push:
    branches: [ highfly-v1-foundation-cc040 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: highfly-foundation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout HIGHFLY Foundation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Fetch ClaudeCraft 0.40.0 stable snapshot
        run: |
          set -euo pipefail
          rm -rf game claudecraft.tar.gz
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
            https://github.com/levy-street/world-of-claudecraft/archive/refs/heads/release/v0.40.0.tar.gz \
            -o claudecraft.tar.gz
          mkdir -p game
          tar -xzf claudecraft.tar.gz --strip-components=1 -C game
          rm -f claudecraft.tar.gz
          node -e "const p=require('./game/package.json'); if(p.version!=='0.40.0') throw new Error('Expected ClaudeCraft 0.40.0, got '+p.version); console.log('ClaudeCraft',p.version)"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install ClaudeCraft dependencies
        working-directory: game
        run: pnpm install --frozen-lockfile

      - name: Apply single HIGHFLY v1 Foundation layer
        working-directory: game
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node ../scripts/patch-highfly-v1-foundation-cc040-preflight.mjs
          node ../scripts/patch-highfly-v1-foundation-cc040.mjs
          # CI-harness-only correction: the generated contract reads its patched
          # source to assert Shaman's authored Nature basic. Keep product mutation
          # in the single Foundation layer; this line only fixes the test import.
          sed -i "1i import fs from 'node:fs';" tests/highfly_v1_foundation.test.ts

      - name: Typecheck HIGHFLY Foundation
        working-directory: game
        run: pnpm run check:ts

      - name: Verify action-combat foundation contracts
        working-directory: game
        run: pnpm exec vitest run tests/highfly_v1_foundation.test.ts tests/hotbar.test.ts

      - name: Build native web bundle
        working-directory: game
        env:
          VITE_NATIVE_APP: '1'
          VITE_HIGHFLY_OFFLINE: '1'
          VITE_API_ORIGIN: 'http://127.0.0.1'
        run: |
          pnpm run build
          node scripts/build_media_manifest.mjs prune

      - name: Sync Capacitor Android
        working-directory: game
        run: pnpm exec cap sync android

      - name: Build Android playDebug APK
        working-directory: game/android
        run: ./gradlew :app:assemblePlayDebug --no-daemon

      - name: Locate Foundation APK
        run: |
          set -euo pipefail
          mkdir -p output
          APK=$(find game/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" output/HIGHFLY_FOUNDATION_CC040_DEBUG.apk
          cp game/public/highfly-build.json output/highfly-build.json
          ls -lh output/HIGHFLY_FOUNDATION_CC040_DEBUG.apk output/highfly-build.json
          cat output/highfly-build.json
          df -h

      - name: Upload Foundation candidate
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-FOUNDATION-CC040-${{ github.sha }}
          path: |
            output/HIGHFLY_FOUNDATION_CC040_DEBUG.apk
            output/highfly-build.json
          if-no-files-found: error
          retention-days: 7
