name: Build HIGHFLY Clean Core APK

on:
  workflow_dispatch:
  push:
    branches: [ highfly-v1-clean-core ]

permissions:
  contents: write

concurrency:
  group: highfly-clean-core-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout HIGHFLY Clean Core
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Fetch ClaudeCraft 0.40.0 stable engine
        run: |
          set -euo pipefail
          rm -rf game claudecraft.tar.gz
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
            https://github.com/levy-street/world-of-claudecraft/archive/refs/heads/release/v0.40.0.tar.gz \
            -o claudecraft.tar.gz
          mkdir -p game
          tar -xzf claudecraft.tar.gz --strip-components=1 -C game
          rm -f claudecraft.tar.gz
          node -e "const p=require('./game/package.json'); if(p.version!=='0.40.0') throw new Error('Expected ClaudeCraft 0.40.0, got '+p.version); console.log('ClaudeCraft',p.version)"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install engine dependencies
        working-directory: game
        run: pnpm install --frozen-lockfile

      - name: Mount HIGHFLY Clean Core and native shell
        run: |
          set -euo pipefail
          mkdir -p game/src/highfly game/tests game/public
          cp -R highfly/src/highfly/. game/src/highfly/
          cp highfly/tests/clean_core.test.ts game/tests/highfly_clean_core.test.ts
          cp highfly/tests/native_shell_contract.test.ts game/tests/highfly_native_shell_contract.test.ts

          # Deliberate, owned seams. These are complete HIGHFLY files, not a replay
          # of legacy source patches.
          cp highfly/engine-overrides/src/game/offline_mode_gate.ts game/src/game/offline_mode_gate.ts
          cp highfly/native/capacitor.config.ts game/capacitor.config.ts
          cp highfly/native/highfly_native_boot.js game/public/highfly-native-boot.js
          cp highfly/native/highfly_native.css game/public/highfly-native.css
          node highfly/native/apply_native_shell.mjs game

          node - <<'NODE'
          const fs = require('fs');
          const manifest = {
            product: 'HIGHFLY',
            foundation: 'v1-clean-core',
            upstream: { product: 'ClaudeCraft', version: '0.40.0' },
            commit: process.env.GITHUB_SHA,
            builtAt: new Date().toISOString(),
            architecture: 'canonical-highfly-modules-plus-platform-adapter',
            legacyPatchReplay: false,
            native: {
              appId: 'com.highfly.nexus',
              appName: 'HIGHFLY',
              boot: 'offline-first',
              upstreamOta: false
            },
            contracts: {
              targetlessBasic: true,
              optionalTargetPriority: true,
              reaverSpatialSweep: true,
              strengthEngine: true,
              idempotentSystemEvents: true,
              highflyNativeIdentity: true,
              offlineProductionBoot: true,
              claudecraftOtaDisabled: true
            }
          };
          fs.writeFileSync('game/public/highfly-build.json', JSON.stringify(manifest, null, 2));
          NODE

      - name: Typecheck Clean Core with engine
        working-directory: game
        run: pnpm run check:ts

      - name: Verify Clean Core and native contracts
        working-directory: game
        run: pnpm exec vitest run tests/highfly_clean_core.test.ts tests/highfly_native_shell_contract.test.ts

      - name: Build native offline web bundle
        working-directory: game
        env:
          VITE_NATIVE_APP: '1'
          VITE_HIGHFLY_OFFLINE: '1'
          VITE_API_ORIGIN: 'http://127.0.0.1'
        run: |
          pnpm run build
          node scripts/build_media_manifest.mjs prune

      - name: Sync Capacitor Android
        working-directory: game
        run: pnpm exec cap sync android

      - name: Verify generated native wrapper
        run: |
          set -euo pipefail
          grep -q '"appId": "com.highfly.nexus"' game/android/app/src/main/assets/capacitor.config.json
          grep -q '"appName": "HIGHFLY"' game/android/app/src/main/assets/capacitor.config.json
          if grep -R -q 'worldofclaudecraft.com/api/ota/updates' game/android/app/src/main/assets game/capacitor.config.ts; then
            echo 'ClaudeCraft OTA endpoint leaked into HIGHFLY native wrapper' >&2
            exit 1
          fi
          grep -q 'applicationId "com.highfly.nexus"' game/android/app/build.gradle
          grep -q '<string name="app_name">HIGHFLY</string>' game/android/app/src/main/res/values/strings.xml

      - name: Build Android playDebug APK
        working-directory: game/android
        run: ./gradlew :app:assemblePlayDebug --no-daemon

      - name: Locate Clean Core offline APK
        run: |
          set -euo pipefail
          mkdir -p output
          APK=$(find game/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" output/HIGHFLY_V1_CLEAN_CORE_CC040_OFFLINE_DEBUG.apk
          cp game/public/highfly-build.json output/highfly-build.json
          ls -lh output/HIGHFLY_V1_CLEAN_CORE_CC040_OFFLINE_DEBUG.apk output/highfly-build.json

      - name: Publish rolling Clean Core release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete highfly-clean-core-latest --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create highfly-clean-core-latest \
            output/HIGHFLY_V1_CLEAN_CORE_CC040_OFFLINE_DEBUG.apk \
            output/highfly-build.json \
            --target "$GITHUB_SHA" \
            --title "HIGHFLY Clean Core Latest" \
            --notes "Automated HIGHFLY v1 Clean Core OFFLINE candidate. ClaudeCraft engine: 0.40.0. Upstream OTA disabled. Commit: $GITHUB_SHA" \
            --prerelease
