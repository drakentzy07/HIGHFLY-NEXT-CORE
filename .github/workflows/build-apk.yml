name: Build HIGHFLY APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: highfly-apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout HIGHFLY overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Fetch ClaudeCraft v0.39.0 snapshot
        run: |
          rm -rf game claudecraft.tar.gz
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 \
            https://github.com/levy-street/world-of-claudecraft/archive/refs/heads/release/v0.39.0.tar.gz \
            -o claudecraft.tar.gz
          mkdir -p game
          tar -xzf claudecraft.tar.gz --strip-components=1 -C game
          rm -f claudecraft.tar.gz
          test -f game/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install ClaudeCraft dependencies
        working-directory: game
        run: pnpm install --frozen-lockfile

      - name: Apply HIGHFLY v0.8.1 semantic skill audit + creator final polish + visible RM
        working-directory: game
        run: |
          node ../scripts/patch-highfly-native.mjs
          node ../scripts/patch-highfly-v0.4-compat.mjs
          node ../scripts/patch-highfly-v0.4.1-creator.mjs
          node ../scripts/patch-highfly-v0.4.3-hud-camera.mjs
          node ../scripts/patch-highfly-v0.5.0-action-foundation.mjs
          node ../scripts/patch-highfly-v0.5.1-free-aim.mjs
          node ../scripts/patch-highfly-v0.5.2-s23-hotfix.mjs
          node ../scripts/patch-highfly-v0.5.3-anchor-fix.mjs
          node ../scripts/patch-highfly-v0.5.3-mobile-skill-aim.mjs
          node ../scripts/patch-highfly-v0.5.4-player-origin-aim.mjs
          node ../scripts/patch-highfly-v0.5.5-action-control.mjs
          node ../scripts/patch-highfly-v0.6.0-big-pass.mjs
          node ../scripts/patch-highfly-v0.6.0-compat.mjs
          node ../scripts/patch-highfly-v0.6.1-full-pass.mjs
          node ../scripts/patch-highfly-v0.6.1-moba-aim.mjs
          node ../scripts/patch-highfly-v0.6.2-creator-s23.mjs
          node ../scripts/patch-highfly-v0.6.3-precompat.mjs
          node ../scripts/patch-highfly-v0.6.3-mobile-polish.mjs
          node ../scripts/patch-highfly-v0.6.3-test-contracts.mjs
          node ../scripts/patch-highfly-v0.6.4-freecast-creator.mjs
          node ../scripts/patch-highfly-v0.6.4.1-lifecycle-fix.mjs
          node ../scripts/patch-highfly-v0.6.4.2-native-bundle.mjs
          node ../scripts/patch-highfly-v0.6.4.3-css-fix.mjs
          node ../scripts/patch-highfly-v0.6.5-action-rm-creator.mjs
          node ../scripts/patch-highfly-v0.6.5.1-creator-state.mjs
          node ../scripts/patch-highfly-v0.6.5.2-creator-runtime.mjs
          node ../scripts/patch-highfly-v0.6.5.3-training-migration.mjs
          node ../scripts/patch-highfly-v0.6.6-creator-combat-flow.mjs
          node ../scripts/patch-highfly-v0.6.6.1-creator-stage.mjs
          node ../scripts/patch-highfly-v0.6.6.2-creator-inline-stage.mjs
          node ../scripts/patch-highfly-v0.7.0-combat-core.mjs
          node ../scripts/patch-highfly-v0.7.1-combat-matrix-creator.mjs
          node ../scripts/patch-highfly-v0.7.1.1-fx-type-fix.mjs
          node ../scripts/patch-highfly-v0.7.2-lane-aim-creator.mjs
          node ../scripts/patch-highfly-v0.7.2.1-creator-fit.mjs
          node ../scripts/patch-highfly-v0.7.3-class-geometry-action-sweep.mjs
          node ../scripts/patch-highfly-v0.7.3.1-smoke-geometry-fix.mjs
          node ../scripts/patch-highfly-v0.7.4-creator-visual-hierarchy.mjs
          node ../scripts/patch-highfly-v0.7.5-creator-balanced-layout.mjs
          node ../scripts/patch-highfly-v0.7.5.1-class-grid-lock.mjs
          node ../scripts/patch-highfly-v0.8.0-fitness-core-rm-e1rm.mjs
          node ../scripts/patch-highfly-v0.8.0.1-creator-dossier-fit.mjs
          node ../scripts/patch-highfly-v0.8.0.2-creator-stat-visibility.mjs
          node ../scripts/patch-highfly-v0.8.0.3-creator-clean-reset.mjs
          node ../scripts/patch-highfly-v0.8.0.4-ci-contracts.mjs
          node ../scripts/patch-highfly-v0.8.0.5-creator-rm-visibility.mjs
          node ../scripts/patch-highfly-v0.8.1-skill-audit-creator-final.mjs

      - name: Typecheck HIGHFLY v0.8.1
        working-directory: game
        run: pnpm run check:ts

      - name: Runtime smoke Apariencia → Clase footer-safe 3x2 stats → Mundo
        working-directory: game
        run: |
          cp ../scripts/highfly_runtime_smoke.mjs scripts/highfly_runtime_smoke.mjs
          node scripts/highfly_runtime_smoke.mjs

      - name: Test HIGHFLY v0.8.1 Fitness Core + RM + semantic skill geometry + creator
        working-directory: game
        run: pnpm exec vitest run tests/highfly_training.test.ts tests/charselect_class_details.test.ts tests/highfly_mobile_aim_contract.test.ts tests/highfly_creator_s23_v062.test.ts tests/highfly_v063_mobile_polish.test.ts tests/highfly_v064_control_creator.test.ts tests/highfly_v065_action_rms_creator.test.ts tests/highfly_v0653_training_migration.test.ts tests/highfly_v066_creator_combat_flow.test.ts tests/highfly_v0661_creator_stage.test.ts tests/highfly_v070_combat_core.test.ts tests/highfly_v071_combat_matrix_creator.test.ts tests/highfly_v0711_fx_type_fix.test.ts tests/highfly_v072_lane_aim_creator.test.ts tests/highfly_v073_class_geometry_action_sweep.test.ts tests/highfly_v074_creator_visual_hierarchy.test.ts tests/highfly_v075_creator_balanced_layout.test.ts tests/highfly_v0751_class_grid_lock.test.ts tests/highfly_v080_fitness_core_rm.test.ts tests/highfly_v0801_creator_dossier_fit.test.ts tests/highfly_v0802_creator_stat_visibility.test.ts tests/highfly_v0803_creator_clean_reset.test.ts tests/highfly_v0805_creator_rm_visibility.test.ts tests/highfly_v081_skill_audit_creator_final.test.ts

      - name: Build native web bundle
        working-directory: game
        env:
          VITE_NATIVE_APP: '1'
          VITE_HIGHFLY_OFFLINE: '1'
          VITE_API_ORIGIN: 'http://127.0.0.1'
        run: |
          pnpm run build
          node scripts/build_media_manifest.mjs prune

      - name: Sync Capacitor Android
        working-directory: game
        run: pnpm exec cap sync android

      - name: Build playDebug APK
        working-directory: game/android
        run: ./gradlew :app:assemblePlayDebug --no-daemon

      - name: Locate APK
        run: |
          mkdir -p output
          APK=$(find game/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" output/HIGHFLY_NEXT_CORE_LATEST_DEBUG.apk
          ls -lh output/HIGHFLY_NEXT_CORE_LATEST_DEBUG.apk
          df -h

      - name: Upload downloadable HIGHFLY APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-APK-${{ github.run_number }}
          path: output/HIGHFLY_NEXT_CORE_LATEST_DEBUG.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling HIGHFLY test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="highfly-latest"
          TITLE="HIGHFLY Latest Test APK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          NOTES="HIGHFLY v0.8.1 test build. APK publishing is intentionally independent from web-preview hosting: the APK is uploaded first so a Pages/Vercel issue cannot block phone testing. Creator, RM / MARCAS, e1RM, semantic skill geometry and approved combat behavior remain unchanged."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --prerelease --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE" --prerelease --notes "$NOTES"
          fi
          gh release upload "$TAG" output/HIGHFLY_NEXT_CORE_LATEST_DEBUG.apk --clobber

      - name: Build HIGHFLY PC Preview
        working-directory: game
        env:
          VITE_NATIVE_APP: '1'
          VITE_HIGHFLY_OFFLINE: '1'
          VITE_API_ORIGIN: 'http://127.0.0.1'
        run: |
          rm -rf dist
          pnpm run build -- --base=./
          node scripts/build_media_manifest.mjs prune
          test -f dist/index.html
          echo "HIGHFLY PC Preview ready from the exact v0.8.1 patched source"

      - name: Configure GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload HIGHFLY PC Preview
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

      - name: Purge old HIGHFLY Actions APK artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("HIGHFLY-NEXT-CORE-")) | .id' \
          | while read -r artifact_id; do
              if [ -n "$artifact_id" ]; then
                echo "Deleting old Actions artifact $artifact_id"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
              fi
            done

  web-preview:
    needs: android
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy HIGHFLY PC Preview
        id: deployment
        uses: actions/deploy-pages@v4
