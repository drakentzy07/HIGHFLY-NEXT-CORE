name: Build HIGHFLY APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  actions: write

concurrency:
  group: highfly-apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout HIGHFLY overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Clone ClaudeCraft v0.39.0
        run: |
          git clone --depth 1 --branch release/v0.39.0 https://github.com/levy-street/world-of-claudecraft.git game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install ClaudeCraft dependencies
        working-directory: game
        run: pnpm install --frozen-lockfile

      - name: Apply HIGHFLY v0.6.3 Full Pass
        working-directory: game
        run: |
          node ../scripts/patch-highfly-native.mjs
          node ../scripts/patch-highfly-v0.4-compat.mjs
          node ../scripts/patch-highfly-v0.4.1-creator.mjs
          node ../scripts/patch-highfly-v0.4.3-hud-camera.mjs
          node ../scripts/patch-highfly-v0.5.0-action-foundation.mjs
          node ../scripts/patch-highfly-v0.5.1-free-aim.mjs
          node ../scripts/patch-highfly-v0.5.2-s23-hotfix.mjs
          node ../scripts/patch-highfly-v0.5.3-anchor-fix.mjs
          node ../scripts/patch-highfly-v0.5.3-mobile-skill-aim.mjs
          node ../scripts/patch-highfly-v0.5.4-player-origin-aim.mjs
          node ../scripts/patch-highfly-v0.5.5-action-control.mjs
          node ../scripts/patch-highfly-v0.6.0-big-pass.mjs
          node ../scripts/patch-highfly-v0.6.0-compat.mjs
          node ../scripts/patch-highfly-v0.6.1-full-pass.mjs
          node ../scripts/patch-highfly-v0.6.1-moba-aim.mjs
          node ../scripts/patch-highfly-v0.6.2-creator-s23.mjs
          node ../scripts/patch-highfly-v0.6.3-precompat.mjs
          node ../scripts/patch-highfly-v0.6.3-mobile-polish.mjs
          node ../scripts/patch-highfly-v0.6.3-test-contracts.mjs

      - name: Typecheck HIGHFLY v0.6.3
        working-directory: game
        run: pnpm run check:ts

      - name: Test HIGHFLY progression + creator + mobile aim + workout contracts
        working-directory: game
        run: pnpm exec vitest run tests/highfly_training.test.ts tests/charselect_class_details.test.ts tests/highfly_mobile_aim_contract.test.ts tests/highfly_creator_s23_v062.test.ts tests/highfly_v063_mobile_polish.test.ts

      - name: Build native web bundle
        working-directory: game
        env:
          VITE_NATIVE_APP: '1'
          VITE_HIGHFLY_OFFLINE: '1'
          VITE_API_ORIGIN: 'http://127.0.0.1'
        run: |
          pnpm run build
          node scripts/build_media_manifest.mjs prune

      - name: Sync Capacitor Android
        working-directory: game
        run: pnpm exec cap sync android

      - name: Build playDebug APK
        working-directory: game/android
        run: ./gradlew :app:assemblePlayDebug --no-daemon

      - name: Locate APK
        run: |
          mkdir -p output
          APK=$(find game/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" output/HIGHFLY_NEXT_CORE_LATEST_DEBUG.apk
          ls -lh output/HIGHFLY_NEXT_CORE_LATEST_DEBUG.apk
          df -h

      - name: Publish rolling HIGHFLY test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="highfly-latest"
          TITLE="HIGHFLY Latest Test APK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --prerelease --notes "HIGHFLY v0.6.3: creator móvil, apuntado tipo MOBA y entrenamiento real por ejercicios/series/RM/descansos."
          else
            gh release create "$TAG" --title "$TITLE" --prerelease --notes "HIGHFLY v0.6.3: creator móvil, apuntado tipo MOBA y entrenamiento real por ejercicios/series/RM/descansos."
          fi
          gh release upload "$TAG" output/HIGHFLY_NEXT_CORE_LATEST_DEBUG.apk --clobber

      - name: Purge old HIGHFLY Actions APK artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("HIGHFLY-NEXT-CORE-")) | .id' \
          | while read -r artifact_id; do
              if [ -n "$artifact_id" ]; then
                echo "Deleting old Actions artifact $artifact_id"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              fi
            done
